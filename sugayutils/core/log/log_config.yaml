version: 1
disable_existing_loggers: False
formatters:
    myfmt:
       format: '[%(asctime)s] %(filename)s %(funcName)s: %(levelname)s - %(message)s'
handlers:
    fileHandler:
        class: logging.FileHandler
        level: INFO
        formatter: myfmt
        filename: 'log.log'
    consoleHandler:
        class: logging.StreamHandler
        level: INFO
        formatter: myfmt
root:
    level: INFO
    handlers: [consoleHandler, fileHandler]
